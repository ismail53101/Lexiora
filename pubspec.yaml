name: lexiora
description: "Lexiora — a premium, offline-first study & language-learning platform. Phase 1: a production-grade PDF study reader with highlights, notes, bookmarks and reading progress."
publish_to: "none"

# Semantic version. The `+N` suffix is the Android versionCode.
version: 0.21.3+53

environment:
  sdk: ">=3.10.0 <4.0.0"

# NOTE: Dependency versions below are pinned by `flutter pub add` against
# Flutter 3.44.8 / Dart 3.12.2 so the lockfile is fully reproducible.
dependencies:
  archive: ^4.0.9
  cupertino_icons: ^1.0.9
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.2
  # Offline, on-device text-to-speech for word pronunciation (Dictionary v2.1).
  flutter_tts: ^4.2.3
  get_it: ^9.2.1
  go_router: ^17.3.0
  gpt_markdown: ^1.1.8
  image_picker: ^1.1.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  pdfrx: ^2.4.7
  permission_handler: ^12.0.3
  share_plus: ^13.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/dictionary/
    - assets/translations/
    - assets/grammar/
    - assets/vocabulary/
    - assets/fonts/
    # NOTE: Flutter's asset bundler only includes files directly inside a
    # declared directory (it does NOT recurse into subdirectories), so each
    # quiz subdirectory must be listed explicitly.
    - assets/quiz/
    - assets/quiz/english/
    - assets/quiz/gsa/
    - assets/quiz/islamiat/
    - assets/quiz/pakistan_affairs/
