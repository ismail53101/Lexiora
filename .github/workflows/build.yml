name: Build Lexiora APK

# Builds, analyzes and tests Lexiora on every push to main, then produces a
# release APK — uploaded both as a workflow artifact and as an asset on the
# v0.1.0 GitHub Release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # required to publish the release asset

jobs:
  build:
    name: Analyze · Test · Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true # caches the Flutter SDK and pub packages

      - name: Print versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift)
        run: dart run build_runner build

      - name: Ensure Gradle wrapper
        # The wrapper jar is intentionally not committed (binary-free repo);
        # regenerate it to match the pinned Gradle version before building.
        run: cd android && gradle wrapper --gradle-version 9.1.0

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexiora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Lexiora v0.1.0
          body: Automated Phase 1 release build of Lexiora.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
