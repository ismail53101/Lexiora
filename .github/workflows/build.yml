name: Build Lexiora APK

# Builds, analyzes and tests Lexiora on every push to main, then produces a
# release APK — uploaded both as a workflow artifact and as an asset on a
# GitHub Release whose tag is derived from the pubspec version (e.g. v0.1.5).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # required to publish the release asset

jobs:
  build:
    name: Analyze · Test · Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true # caches the Flutter SDK and pub packages

      - name: Print versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift)
        run: dart run build_runner build

      - name: Ensure Gradle wrapper
        # The wrapper jar is intentionally not committed (binary-free repo);
        # regenerate it to match the pinned Gradle version before building.
        run: cd android && gradle wrapper --gradle-version 9.1.0

      - name: Set up release signing
        # Runs every time, but only actually does anything when the keystore
        # secret exists -- see android/KEYSTORE.md. Until then, the build
        # falls back to debug signing automatically (see
        # android/app/build.gradle.kts), so this step doing nothing never
        # breaks the build. The check has to live in the shell script, not a
        # YAML `if:`, because GitHub Actions doesn't allow referencing
        # `secrets` directly in step-level `if:` conditions.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set -- building with debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        # SAPIORA_AI_API_KEY / SAPIORA_AI_BASE_URL / SAPIORA_AI_PROVIDER come
        # from repo secrets (Settings -> Secrets and variables -> Actions) so
        # the AI Assistant is configured in the built APK without any of
        # them being committed to the repo. SAPIORA_AI_BASE_URL is optional --
        # when unset, this step omits that define and the app falls back to
        # its compiled-in default (https://api.hcnsec.cn); set it to point
        # the app at the Cloudflare Worker gateway instead (see
        # cloudflare-worker/README.md), which holds the real upstream
        # provider keys. SAPIORA_AI_PROVIDER is optional too -- leave it
        # unset for "auto" (the Worker decides, with automatic fallback).
        # If SAPIORA_AI_API_KEY isn't set, the build still succeeds -- the
        # app simply shows its existing "not configured" screen.
        #
        # SAPIORA_ENABLE_ADMIN: while it's set to "true", every build this
        # workflow produces (APK and AAB) includes the Admin Panel -- meant
        # for personal practice/curation only. Delete this secret (or set it
        # to anything other than "true") before the Play Store release build,
        # so the public build compiles without the Admin Panel's code at all.
        env:
          SAPIORA_AI_API_KEY: ${{ secrets.SAPIORA_AI_API_KEY }}
          SAPIORA_AI_BASE_URL: ${{ secrets.SAPIORA_AI_BASE_URL }}
          SAPIORA_AI_PROVIDER: ${{ secrets.SAPIORA_AI_PROVIDER }}
          SAPIORA_ENABLE_ADMIN: ${{ secrets.SAPIORA_ENABLE_ADMIN }}
        run: |
          DEFINES="--dart-define=SAPIORA_AI_API_KEY=$SAPIORA_AI_API_KEY"
          if [ -n "$SAPIORA_AI_BASE_URL" ]; then
            DEFINES="$DEFINES --dart-define=SAPIORA_AI_BASE_URL=$SAPIORA_AI_BASE_URL"
          fi
          if [ -n "$SAPIORA_AI_PROVIDER" ]; then
            DEFINES="$DEFINES --dart-define=SAPIORA_AI_PROVIDER=$SAPIORA_AI_PROVIDER"
          fi
          if [ "$SAPIORA_ENABLE_ADMIN" = "true" ]; then
            DEFINES="$DEFINES --dart-define=SAPIORA_ENABLE_ADMIN=true"
          fi
          flutter build apk --release $DEFINES

      - name: Build release App Bundle (.aab, for Play Store)
        env:
          SAPIORA_AI_API_KEY: ${{ secrets.SAPIORA_AI_API_KEY }}
          SAPIORA_AI_BASE_URL: ${{ secrets.SAPIORA_AI_BASE_URL }}
          SAPIORA_AI_PROVIDER: ${{ secrets.SAPIORA_AI_PROVIDER }}
          SAPIORA_ENABLE_ADMIN: ${{ secrets.SAPIORA_ENABLE_ADMIN }}
        run: |
          DEFINES="--dart-define=SAPIORA_AI_API_KEY=$SAPIORA_AI_API_KEY"
          if [ -n "$SAPIORA_AI_BASE_URL" ]; then
            DEFINES="$DEFINES --dart-define=SAPIORA_AI_BASE_URL=$SAPIORA_AI_BASE_URL"
          fi
          if [ -n "$SAPIORA_AI_PROVIDER" ]; then
            DEFINES="$DEFINES --dart-define=SAPIORA_AI_PROVIDER=$SAPIORA_AI_PROVIDER"
          fi
          if [ "$SAPIORA_ENABLE_ADMIN" = "true" ]; then
            DEFINES="$DEFINES --dart-define=SAPIORA_ENABLE_ADMIN=true"
          fi
          flutter build appbundle --release $DEFINES

      - name: Resolve app version
        id: ver
        run: echo "v=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexiora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapiora-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Lexiora v${{ steps.ver.outputs.v }}
          body: Automated Phase 1 release build of Lexiora.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
